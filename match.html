<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>India vs Pakistan</title>
<style>
body{margin:0;background:#0b1220;color:#fff;font-family:Arial;padding-bottom:80px}
.top{background:#111827;padding:15px;text-align:center;font-size:22px;font-weight:bold;color:#f59e0b}
.card{background:#111827;margin:15px;border-radius:16px;padding:15px;border:1px solid #1f2937}
.live{color:#22c55e;font-weight:bold}
.row{display:flex;justify-content:space-between;margin:10px 0}
.odds{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.back{background:#2563eb;padding:12px;border-radius:10px;text-align:center;font-weight:bold}
.lay{background:#dc2626;padding:12px;border-radius:10px;text-align:center;font-weight:bold}
.market{background:#0f172a;margin-top:12px;border-radius:12px;padding:12px}
.market h3{margin:0 0 10px;color:#fbbf24}
a{color:white;text-decoration:none}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#111827;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #1f2937}
.bottom div{text-align:center;font-size:12px;color:#cbd5e1}
.bottom .a{color:#f59e0b}
</style>
</head>
<body>

<div class="top">🏏 India vs Pakistan</div>

<div class="card">
  <div class="live">● LIVE</div>
  <div class="row"><span>India</span><span>182/5</span></div>
  <div class="row"><span>Pakistan</span><span>19.4 ov</span></div>
  <div class="row"><span>Current RR</span><span>9.25</span></div>

  <div class="odds">
    <div class="back">BACK 1.82</div>
    <div class="lay">LAY 1.88</div>
    <div class="back">BACK 1.83</div>
    <div class="lay">LAY 1.89</div>
  </div>
</div>

<div class="card market">
  <h3>📊 Match Odds</h3>
  <div class="row"><span>India</span><span>1.82</span></div>
  <div class="row"><span>Pakistan</span><span>2.14</span></div>
</div>

<div class="card market">
  <h3>⚡ Fancy</h3>
  <div class="row"><span>Over 19.5</span><span>1.95</span></div>
  <div class="row"><span>Over 20.5</span><span>2.20</span></div>
  <div class="row"><span>Over 21.5</span><span>2.60</span></div>
</div>

<div class="card market">
  <h3>🔥 Bookmaker</h3>
  <div class="row"><span>India</span><span>1.80</span></div>
  <div class="row"><span>Pakistan</span><span>2.10</span></div>
</div>

<div class="bottom">
  <div class="a"><a href="index.html">🏠<br>Home</a></div>
  <div>🔴<br>Live</div>
  <div>🎯<br>Markets</div>
  <div><a href="profile.html">👤<br>Profile</a></div>
</div>

</body>
</html>
