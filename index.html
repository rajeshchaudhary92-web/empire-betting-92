<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empire Betting</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding-bottom:70px;
}

.header{
  background:#111827;
  color:#f59e0b;
  text-align:center;
  padding:15px;
  font-size:24px;
  font-weight:bold;
}

.tabs{
  display:flex;
  background:#1e293b;
  overflow:auto;
}

.tab{
  padding:12px 16px;
  color:#cbd5e1;
  white-space:nowrap;
  font-weight:bold;
}

.tab.active{
  color:#f59e0b;
  border-bottom:2px solid #f59e0b;
}

.section{
  padding:15px;
}

.section h2{
  color:#f59e0b;
  margin-bottom:10px;
}

.card{
  background:#1e293b;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
}

.live{
  color:#22c55e;
  font-weight:bold;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:0.4;}
}

.team{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
  font-size:18px;
}

.time{
  color:#94a3b8;
  font-size:14px;
}

.odds{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.odd{
  flex:1;
  padding:10px;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
}

.back{
  background:#2563eb;
}

.lay{
  background:#dc2626;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111827;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  border-top:1px solid #334155;
}

.bottom div{
  text-align:center;
  font-size:12px;
  color:#cbd5e1;
}

.bottom .active{
  color:#f59e0b;
}
</style>
</head>

<body>

<div class="header">EMPIRE BETTING</div>

<div class="tabs">
  <div class="tab active">🏏 Cricket</div>
  <div class="tab">⚽ Football</div>
  <div class="tab">🎾 Tennis</div>
</div>

<div class="section">
  <h2>🔴 Live Matches</h2>

  <div class="card">
    <div class="live">LIVE</div>
    <div class="team"><span>India</span><span>156/4</span></div>
    <div class="team"><span>Pakistan</span><span>18.2 ov</span></div>
    <div class="time">Asia Cup • Dubai</div>

    <div class="odds">
      <div class="odd back">BACK 1.82</div>
      <div class="odd lay">LAY 1.88</div>
    </div>
  </div>
</div>

<div class="section">
  <h2>📅 Upcoming Matches</h2>

  <div class="card">
    <div class="team">
      <span>CSK</span>
      <span>vs</span>
      <span>MI</span>
    </div>
    <div class="time">Today • 7:30 PM • IPL</div>
  </div>
</div>

<div class="section">
  <h2>🔥 Popular Markets</h2>

  <div class="card">
    <div class="team">
      <span>Match Winner</span>
      <span>India</span>
    </div>
  </div>
</div>

<div class="bottom">
  <div class="active">🏠<br>Home</div>
  <div>🔴<br>Live</div>
  <div>🎯<br>Markets</div>
  <div>👤<br>Profile</div>
</div>

</body>
</html>
