<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Bets</title>
<style>
body{margin:0;background:#0b1220;color:#fff;font-family:Arial}
.top{background:#111827;padding:15px;text-align:center;font-size:22px;font-weight:bold;color:#f59e0b}
.card{background:#111827;margin:15px;border-radius:16px;padding:15px;border:1px solid #1f2937}
.row{display:flex;justify-content:space-between;margin:8px 0}
.win{color:#22c55e}.lose{color:#ef4444}
</style>
</head>
<body>

<div class="top">📄 My Bets</div>

<div class="card">
  <div class="row"><span>India BACK</span><span>₹500</span></div>
  <div class="row"><span>Odds 1.82</span><span class="win">+₹410</span></div>
</div>

<div class="card">
  <div class="row"><span>Liverpool BACK</span><span>₹300</span></div>
  <div class="row"><span>Odds 1.45</span><span class="lose">-₹300</span></div>
</div>

</body>
</html>
